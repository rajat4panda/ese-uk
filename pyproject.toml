[project]
name = "ese-student-system"
version = "0.1.0"
description = "International Student Recruitment & Compliance System — ESE Insight Limited (eMigrant® platform)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["web", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4"]
ignore = [
  "S101",   # assert is fine in tests
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "S105", "S106",  # test fixtures use literal passwords
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
  "priority: LLD Section 18.2 priority test case (T-nn)",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/*", "app/cli.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
